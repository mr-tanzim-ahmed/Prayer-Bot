<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title description">
  <title id="title">Prayer-Bot ESP32 DevKit wiring overview</title>
  <desc id="description">ESP32-WROOM-32 DevKit pin map for OLED, MPU6050 and HMC5883L or QMC5883L Qibla compass on shared I2C, touch input, I2S amplifier, and microphone.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #18212f; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #526174; }
    .heading { font-size: 17px; font-weight: 700; }
    .body { font-size: 14px; }
    .small { font-size: 12px; fill: #526174; }
    .card { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
    .pin { font-size: 13px; font-weight: 700; fill: #fff; }
    .light-text { fill: #fff; }
    .light-muted { fill: #dbeafe; }
    .light-warning { fill: #fbbf24; }
  </style>
  <rect width="1000" height="760" fill="#f3f6fa"/>
  <text x="40" y="48" class="title">Prayer-Bot | ESP32 DevKit (CH340 USB-C)</text>
  <text x="40" y="76" class="subtitle">Wiring overview for the ESP32-WROOM-32 DevKit. All modules share GND.</text>

  <rect x="45" y="115" width="280" height="570" rx="18" fill="#18324d"/>
  <text x="185" y="155" text-anchor="middle" class="heading light-text">ESP32-WROOM-32</text>
  <text x="185" y="178" text-anchor="middle" class="small light-muted">DevKit board</text>
  <g>
    <rect x="65" y="210" width="112" height="34" rx="6" fill="#2563eb"/><text x="121" y="232" text-anchor="middle" class="pin">GPIO 21 SDA</text>
    <rect x="193" y="210" width="112" height="34" rx="6" fill="#2563eb"/><text x="249" y="232" text-anchor="middle" class="pin">GPIO 22 SCL</text>
    <rect x="65" y="265" width="112" height="34" rx="6" fill="#7c3aed"/><text x="121" y="287" text-anchor="middle" class="pin">GPIO 4</text>
    <rect x="193" y="265" width="112" height="34" rx="6" fill="#059669"/><text x="249" y="287" text-anchor="middle" class="pin">GPIO 26</text>
    <rect x="65" y="310" width="112" height="34" rx="6" fill="#059669"/><text x="121" y="332" text-anchor="middle" class="pin">GPIO 25</text>
    <rect x="193" y="310" width="112" height="34" rx="6" fill="#059669"/><text x="249" y="332" text-anchor="middle" class="pin">GPIO 27</text>
    <rect x="65" y="365" width="112" height="34" rx="6" fill="#d97706"/><text x="121" y="387" text-anchor="middle" class="pin">GPIO 16</text>
    <rect x="193" y="365" width="112" height="34" rx="6" fill="#d97706"/><text x="249" y="387" text-anchor="middle" class="pin">GPIO 17</text>
    <rect x="65" y="410" width="112" height="34" rx="6" fill="#d97706"/><text x="121" y="432" text-anchor="middle" class="pin">GPIO 18</text>
    <rect x="193" y="410" width="112" height="34" rx="6" fill="#475569"/><text x="249" y="432" text-anchor="middle" class="pin">3V3 / GND</text>
  </g>
  <text x="185" y="490" text-anchor="middle" class="body light-text">Shared I2C: GPIO 21 / 22</text>
  <text x="185" y="518" text-anchor="middle" class="small light-muted">Use the board's regulated 3.3 V rail</text>
  <text x="185" y="542" text-anchor="middle" class="small light-muted">Common ground for every module</text>
  <text x="185" y="615" text-anchor="middle" class="small light-warning">MAX98357A SD: leave disconnected</text>
  <text x="185" y="640" text-anchor="middle" class="small light-muted">until the sparking issue is resolved</text>

  <rect x="370" y="115" width="585" height="160" rx="14" class="card"/>
  <text x="395" y="147" class="heading">Shared I2C bus | GPIO 21 SDA, GPIO 22 SCL</text>
  <text x="395" y="183" class="body">1.3-inch SH1106 OLED</text>
  <text x="680" y="183" class="body">MPU6050 / GY-521</text>
  <text x="395" y="220" class="body">HMC/QMC Qibla compass / GY-271 or GY-273</text>
  <text x="395" y="251" class="small">Used by Qibla screen; mount flat and calibrate by rotating.</text>

  <rect x="370" y="300" width="280" height="115" rx="14" class="card"/>
  <text x="395" y="333" class="heading">TTP223B touch sensor</text>
  <text x="395" y="365" class="body">SIG / OUT → GPIO 4</text>
  <text x="395" y="393" class="small">VCC → 3.3 V | GND → common GND</text>

  <rect x="675" y="300" width="280" height="160" rx="14" class="card"/>
  <text x="700" y="333" class="heading">MAX98357A amplifier</text>
  <text x="700" y="365" class="body">BCLK 26 | LRC / WS 25</text>
  <text x="700" y="390" class="body">DIN 27 | VIN → regulated 3.3 V</text>
  <text x="700" y="420" class="small">Speaker connects to SPK+ / SPK- only.</text>
  <text x="700" y="442" class="small">Keep SD disconnected for now.</text>

  <rect x="370" y="440" width="280" height="150" rx="14" class="card"/>
  <text x="395" y="473" class="heading">INMP441 microphone</text>
  <text x="395" y="505" class="body">SCK 16 | WS 17 | SD 18</text>
  <text x="395" y="533" class="body">L/R → GND | VDD → 3.3 V</text>
  <text x="395" y="562" class="small">Optional; separate I2S interface.</text>

  <rect x="675" y="485" width="280" height="105" rx="14" class="card"/>
  <text x="700" y="520" class="heading">Power and grounding</text>
  <text x="700" y="550" class="body">USB-C powers the DevKit</text>
  <text x="700" y="573" class="small">Connect all component GND pins together.</text>

  <text x="40" y="725" class="small">Check the actual compass IC and board voltage requirements before powering. GY-271/GY-273 labels can vary by seller.</text>
</svg>
